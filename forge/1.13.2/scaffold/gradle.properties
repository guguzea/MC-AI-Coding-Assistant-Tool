# Forge Gradle Memory — 2 GB minimum for 1.13.2
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# ---- Minecraft / Forge 版本（必须与 Forge 版本匹配）----
minecraft_version=1.13.2
minecraft_version_range=[1.13.2,1.14)

forge_version=25.0.219
forge_version_range=[25,)

# ---- Mappings（MCP SRG 格式，1.13.2）----
mapping_channel=mcp
mapping_version=1.13.2

# ---- Mod 元数据（修改这些值以匹配你的模组）----
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
