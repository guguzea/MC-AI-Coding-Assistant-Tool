# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Official MDK: forge-1.13.2-25.0.223-mdk (promotions recommended/latest)
minecraft_version=1.13.2
minecraft_version_range=[1.13.2,1.14)
forge_version=25.0.223
forge_version_range=[25,)
loader_version_range=[25,)

# Official MDK minecraft { mappings channel: 'snapshot', version: '20180921-1.13' }
mapping_channel=snapshot
mapping_version=20180921-1.13

mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
