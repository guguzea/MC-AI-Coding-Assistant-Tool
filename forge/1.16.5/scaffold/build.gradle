plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[4.1,4.2)'
}

version = mod_version
group = mod_group_id

// FG4 硬拒 Gradle ≥7，而 base.archivesName 是 Gradle 7+ DSL（6.9.4 实测无此属性）
// ⇒ 用 Gradle 6 可用的顶层 archivesBaseName，与同 FG4 档 forge/1.15.2 一致
archivesBaseName = mod_id

// 官方 1.16.5-36.2.34 MDK 的 build.gradle:19 写的就是 JavaLanguageVersion.of(8)
// （其注释："Mojang ships Java 8 to end users, so your mod should target Java 8."）；
// 文档同调：gettingstarted.md:14、primer_1_16_5.md:614「You must only use Java 8 code」
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // official（mojmap）mappings —— 本包 FG4 实测唯一可用可读名通道
    // 换 Parchment 需先升到 ForgeGradle 5+：FG4 报 Unknown mapping provider: parchment_*
    // FG4 的 MinecraftExtension 也声明了这两个字段，裸写会被 DELEGATE_FIRST 命中其空值 → 显式 project.
    mappings channel: project.mapping_channel, version: project.mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/'),
                '--existing', file('src/main/resources/')
        }
    }
}

// Data generators write to src/generated/resources; IDE reads from both
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources').configure {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        mod_authors           : mod_authors,
        mod_description       : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            'Specification-Title'     : mod_id,
            'Specification-Vendor'     : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
