# Forge Gradle Memory — 3 GB minimum, decompilation is memory-intensive
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Minecraft / Forge 版本（必须与 Forge 版本匹配）----
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)

forge_version=36.2.34
forge_version_range=[36,)
loader_version_range=[36,)

# ---- Mappings（本包 ForgeGradle [4.1,4.2) 实测只认 official / snapshot 通道）----
# channel=parchment 真机失败：java.lang.IllegalArgumentException: Unknown mapping provider: parchment_2021.07.27-1.16.5
# official = 官方 1.16.5-36.2.34 MDK 默认；本包 rules / skills / code-patterns 示例一律按 official（mojmap）名书写
mapping_channel=official
mapping_version=1.16.5

# ---- Mod 元数据（修改这些值以匹配你的模组）----
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
# 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
# 发现钉值过期或有误，请提 issue：
# https://github.com/guguzea/MC-AI-Coding-Assistant-Tool/issues
# ================================================================
