# Forge Gradle Memory — 3 GB minimum, decompilation is memory-intensive
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Minecraft / Forge 版本（必须与 Forge 版本匹配）----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)

forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# ---- Mappings（本包默认 parchment = mojmap 名 + 社区参数名/javadoc，librarian 接线已在 scaffold 内备好）----
# parchment: 版本形如 YYYY.MM.DD-<MCVersion>；类/方法/字段名与 official 相同，多出参数名与 javadoc
# official : Mojang 官方映射名（无参数名）—— 官方 1.20.1-47.4.10 MDK 的默认值就是它（MDK gradle.properties:35）
# 换回 official：只改下面两行为 mapping_channel=official / mapping_version=1.20.1（librarian 插件与仓库留着无害，不被调用）
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# ---- Mod 元数据（修改这些值以匹配你的模组）----
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
# 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
# 发现钉值过期或有误，请提 issue：
# https://github.com/guguzea/MC-AI-Coding-Assistant-Tool/issues
# ================================================================
