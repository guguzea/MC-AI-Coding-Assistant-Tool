# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Official MDK: forge-1.17.1-37.1.1-mdk (promotions recommended/latest)
minecraft_version=1.17.1
minecraft_version_range=[1.17.1,1.18)
forge_version=37.1.1
forge_version_range=[37,)
loader_version_range=[37,)

# Official MDK: mappings channel: 'official', version: '1.17.1'
mapping_channel=official
mapping_version=1.17.1

mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
