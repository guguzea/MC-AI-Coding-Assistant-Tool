# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Official MDK: forge-1.14.4-28.2.26-mdk (promotions recommended/latest)
minecraft_version=1.14.4
minecraft_version_range=[1.14.4,1.15)
forge_version=28.2.26
forge_version_range=[28,)
loader_version_range=[28,)

# Official MDK minecraft { mappings channel: 'snapshot', version: '20190719-1.14.3' }
mapping_channel=snapshot
mapping_version=20190719-1.14.3

mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
