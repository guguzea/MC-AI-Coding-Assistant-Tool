# Forge Gradle Memory — 3 GB minimum, decompilation is memory-intensive
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Minecraft / Forge 版本（必须与 Forge 版本匹配）----
minecraft_version=1.14.4
minecraft_version_range=[1.14.4,1.15)

forge_version=28.2.0
forge_version_range=[28,)
loader_version_range=[28,)

# ---- Mappings（Forge 1.14.4 使用 MCP snapshot）----
mapping_channel=snapshot
mapping_version=20191213.143200

# ---- Mod 元数据（修改这些值以匹配你的模组）----
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
