# Forge Gradle Memory — 3 GB minimum, decompilation is memory-intensive
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Minecraft / Forge 版本（必须与 Forge 版本匹配）----
minecraft_version=1.20.4
minecraft_version_range=[1.20.4,1.21)

forge_version=49.2.0
forge_version_range=[49,)
loader_version_range=[49,)

# ---- Mappings（本包默认 parchment；official = Mojang 官方可读名、无参数名）----
# official: Mojang 官方名（类名/方法/字段；无参数名）
# parchment: 社区维护的、叠在 official 之上的参数名与 javadoc 层
mapping_channel=parchment
mapping_version=2024.02.25-1.20.4

# ---- Mod 元数据（修改这些值以匹配你的模组）----
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=Example mod description.\nAdd lines as needed.
