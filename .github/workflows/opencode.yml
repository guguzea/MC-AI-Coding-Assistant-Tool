name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # OWNER/MEMBER only — fork PR comments must not spend paid LLM credits.
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER') &&
      (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    # CI 语义：agent 在仓库里跑 mc-skill CLI 时，下载类工具诚实失败而非静默拉网络。
    env:
      MC_SKILL_SKIP_DOWNLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          model: deepseek/deepseek-v4-pro
