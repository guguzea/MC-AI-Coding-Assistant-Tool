name: Release (mcp-server)

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:

# 发布链与 CI 同为每-PR 触发口径（见 mcp-server-ci.yml:3-8），
# 但两者跑在不同 job 里，故在此显式声明取消策略，避免同一分支连续推 tag
# 时旧 run 与新 run 并行争抢 Release 资产。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # 发布链比 CI 多 build:yarn-sqlite + data audit + 打包 2.0 GB data zip，
    # 故超时给到 120（不可照抄 CI 的 45 —— 45 会误杀正常发布）。
    timeout-minutes: 120
    # CI 语义：发布链同样禁止下载类工具碰网络（smoke 只点名工具、不真跑反编译，见 scripts/release-smoke.mjs）。
    env:
      MC_SKILL_SKIP_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      # 这里曾有一版「tag 必须落在 main 上」的前置校验，2026-10-07 撤除，原因两条：
      # ① 本 workflow 未给 gh 配凭据（查询失败会被 `|| echo ""` 吞成「不在 main」，反而堵死全部发版）；
      # ② `commits/<sha>/branches-where-head` 的语义是「该 commit 是 HEAD 的分支」，对非顶端的老 commit 误判。

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Ensure yarn SQLite artefacts
        working-directory: mcp-server
        run: npm run build:yarn-sqlite

      - name: Data audit (fail on error)
        working-directory: mcp-server
        run: npm run audit:data:fail-on-error
        env:
          MC_SKILL_DATA: ${{ github.workspace }}/data

      - name: Test
        working-directory: mcp-server
        run: npm test
        env:
          MC_SKILL_DATA: ${{ github.workspace }}/data
          MCP_TIMEOUT_MS: 60000

      - name: npm audit (production)
        working-directory: mcp-server
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare release bundles
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          SERVER_ZIP="mcp-server-${TAG_NAME}.zip"
          DATA_ZIP="mc-skill-data-full-${TAG_NAME}.zip"

          mkdir -p release/mcp-server release/staging-data
          cp -R mcp-server/dist release/mcp-server/
          cp mcp-server/package.json release/mcp-server/
          cp mcp-server/package-lock.json release/mcp-server/
          cp mcp-server/README.md release/mcp-server/
          cp LICENSE release/mcp-server/ 2>/dev/null || true
          if [ -f THIRD_PARTY_NOTICES.md ]; then
            cp THIRD_PARTY_NOTICES.md release/mcp-server/
          fi

          # Full data minus junk (no rsync dependency)
          mkdir -p release/staging-data
          cp -a data/. release/staging-data/
          rm -rf release/staging-data/test_mcp_check \
                 release/staging-data/_debug_* \
                 release/staging-data/_temp \
                 release/staging-data/audit-*.txt || true

          # Compact manifest (platforms / versions / mapping artefacts)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("release/staging-data")
          platforms = {}
          for p in sorted(root.iterdir()):
              if not p.is_dir():
                  continue
              name = p.name
              info = {"mappings": [], "has_docs": False}
              for m in (p / "mappings").glob("*") if (p / "mappings").is_dir() else []:
                  if m.suffix in {".zip", ".json", ".sqlite", ".gz", ".tiny"} or m.name.endswith(".tiny"):
                      info["mappings"].append(m.name)
              for sub in ("forge-docs", "fabric-docs", "fabric-wiki", "neoforge-docs"):
                  if (p / sub).exists():
                      info["has_docs"] = True
              platforms[name] = info
          Path("release/data-manifest.json").write_text(
              json.dumps({"platformDirs": platforms}, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          print("manifest dirs", len(platforms))
          PY

          (cd release && zip -r -q "../${SERVER_ZIP}" mcp-server)
          (cd release/staging-data && zip -r -q "../../${DATA_ZIP}" .)
          # Checksums must use bare filenames: softprops/action-gh-release uploads
          # release/data-manifest.json as data-manifest.json (directory stripped).
          {
            sha256sum "${SERVER_ZIP}" "${DATA_ZIP}"
            (cd release && sha256sum data-manifest.json)
          } > "SHA256SUMS-${TAG_NAME}.txt"
          echo "SERVER_ZIP=${SERVER_ZIP}" >> "$GITHUB_ENV"
          echo "DATA_ZIP=${DATA_ZIP}" >> "$GITHUB_ENV"
          echo "SUMS=SHA256SUMS-${TAG_NAME}.txt" >> "$GITHUB_ENV"

      - name: Release smoke (checkout node_modules, not artifact)
        working-directory: mcp-server
        run: npm run smoke:release
        env:
          MC_SKILL_DATA: ${{ github.workspace }}/data
          MCP_TIMEOUT_MS: 60000
          # 与 mcp-server-ci.yml:83 对齐：不设则 release-smoke.mjs:124 走「全量 copy data/」
          # 而非 junction，发布链会多拷 2.0 GB（CI 快得多、发布慢得多）。
          MC_SKILL_SMOKE_DATA_LINK: "1"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SERVER_ZIP }}
            ${{ env.DATA_ZIP }}
            ${{ env.SUMS }}
            release/data-manifest.json
          generate_release_notes: true
          body: |
            ## Install

            Server zip **does not** include `node_modules` (same as git). Build locally:

            1. **Check Node.js** (Yarn mappings need `node:sqlite`):
               ```bash
               node -v
               # must be v22.5+
               node -e "const [maj,min]=process.versions.node.split('.').map(Number); if(maj<22||(maj===22&&min<5)){console.error('Need Node >=22.5');process.exit(1)} else console.log('OK',process.versions.node)"
               ```
            2. Unzip **mcp-server** zip and **mc-skill-data-full** zip
            3. Install & build:
               ```bash
               cd mcp-server
               npm ci
               npm run build
               # If dist/ is already present in the zip, `npm ci --omit=dev` is enough to run.
               ```
            4. Configure Cursor MCP stdio:

            ```json
            {
              "mcpServers": {
                "MC-AI-Coding-Assistant-Tool": {
                  "command": "node",
                  "args": ["/absolute/path/to/mcp-server/dist/index.js"],
                  "env": {
                    "MC_SKILL_DATA": "/absolute/path/to/data"
                  }
                }
              }
            }
            ```

            Requires **Node.js >= 22.5**. Yarn lookups use prebuilt `yarn-mappings.sqlite` (never loads full JSON).