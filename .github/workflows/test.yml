name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        working-directory: mcp-server
        run: npm ci

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Build yarn SQLite if missing
        working-directory: mcp-server
        shell: bash
        run: |
          if [ ! -f "${{ github.workspace }}/data/fabric_1.20.1/mappings/yarn-mappings.sqlite" ]; then
            npm run build:yarn-sqlite
          fi

      - name: Data audit
        working-directory: mcp-server
        run: npm run audit:data:fail-on-error
        env:
          MC_SKILL_DATA: ${{ github.workspace }}/data

      - name: Test
        working-directory: mcp-server
        run: npm test
        env:
          MC_SKILL_DATA: ${{ github.workspace }}/data
          MCP_TIMEOUT_MS: 60000
