# Minecraft
minecraft_version=1.18.2
yarn_mappings=1.18.2+build.4
loader_version=0.14.24
fabric_api_version=0.77.0+1.18.2

# Mod
mod_id=examplemod
mod_name=Example Mod
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourNameHere
mod_description=An example Fabric mod.
mod_license=MIT

# Maven
maven_group=com.example

# JVM
org.gradle.jvmargs=-Xmx2G

# Fabric
fabric.loom.platform=fabric

# IntelliJ
idea.module.sourceDirs=src/main/java
idea.module.resourcesDirs=src/main/resources
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
# 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
# 发现钉值过期或有误，请提 issue：
