plugins {
    // Loom 版本以 https://fabricmc.net/develop/ 与 search_fabric_docs version=1.21.8 为准，禁止默写
    // remap 线专用 id（≤1.21.x 混淆时代）；去混淆的 26.x 用 net.fabricmc.fabric-loom
    id "net.fabricmc.fabric-loom-remap"
}

version = project.mod_version
group = project.maven_group

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // mappings / fabric-loader 版本以 search_fabric_docs version=1.21.8 与官方模板为准，禁止默写
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
