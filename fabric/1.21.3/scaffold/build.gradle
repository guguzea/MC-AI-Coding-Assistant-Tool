plugins {
    // 状态：2026-09-16 用户裁定改走「升 Gradle ≥8.10」——本档 wrapper 8.6 → 8.10（三件套换 8.10 官方产物、
    //   properties 改 gradle-8.10-bin.zip），loom 保持 1.8.13；真机构建结果见 pack.meta.json 的 scaffold.provenance。
    // 为什么必须升（降 loom 已实测不可行）：
    //   ① fabric-api 0.110.0+1.21.3 的 MANIFEST.MF 硬声明 Fabric-Loom-Version: 1.8.11（本档唯一可用的 fapi 构建）
    //      ⇒ loom <1.8.11 在 setup Minecraft 阶段被拒：实测 loom 1.6.12 →
    //      "Mod was built with a newer version of Loom (1.8.11), you are using Loom (1.6.12)"（拒绝逻辑在 ArtifactMetadata）。
    //   ② loom ≥1.8.11 要求 Gradle ≥8.10：GMM 实测 1.8.1 / 1.8.6 / 1.8.11 均声明 org.gradle.plugin.api-version=8.10
    //      （1.8.0 无 jar 仅 404；1.7.4=8.8；1.6.12 不声明但被 ① 拒）。
    //   ⇒ 8.10 与 loom 1.8.13 相容（api-version=8.10 正好满足）；钉值同步：test-core 的 WRAPPER_JARS 撤 "8.6" 条目、
    //      wrapper-jars.json 撤 8.6 表项并把 fabric/1.21.3 记入 8.10.usedBy 与 boot.rows（boot 实测 rc=0，banner=8.10）。
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    // accessWidenerPath = file("src/main/resources/examplemod.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API：本档 src 有 import net.fabricmc.fabric.api.*，不启用这条就编译不过
    // 坐标 groupId 与本文件 Cloth 段的 exclude group 同源；版本取自 gradle.properties 的 fabric_api_version，不在此硬编码
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config（配置系统）
    // modApi("me.shedaniel.cloth:cloth-config-fabric:13.0.0+1.21") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta", "examplemod.mixins.json"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "maven_group": project.maven_group,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

// 中文注释在 Windows 默认码集（GBK）下会让 :javadoc 报「编码 GBK 的不可映射字符」
tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}
