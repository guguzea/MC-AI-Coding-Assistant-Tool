plugins {
    // 状态：本档仍未跑通 ⇒ 不得登记 buildVerified。
    // 原钉 '1.8' 上游不存在（2026-09-14 实取 maven.fabricmc.net 的 net/fabricmc/fabric-loom/maven-metadata.xml，
    // 873 个版本里 1.8 线只有 1.8.1…1.8.13 与 1.8-SNAPSHOT）⇒ 配置期必然失败，先改到同线已发布的最新具体版 1.8.13。
    // 但改完仍失败，根因是两把版本钉互斥（实测 Gradle Module Metadata）：
    //   loom 1.8.13 与 1.7.4 都声明 org.gradle.plugin.api-version = 8.10，
    //   而本档 gradle/wrapper 钉 8.6 —— 且 8.6 被三处门禁钉值固定：
    //   mcp-server/test-core.mjs 的 WRAPPER_JARS 表、mcp-server/data/wrapper-jars.json 的 jars / boot.usedBy。
    // 收敛方式二选一，由维护者裁定：① 升本档 Gradle 到 ≥8.10（同步改 wrapper 三件套与 pack.meta 的 scaffold.gradle 及上述钉值表）；
    // ② 把 loom 降到「声明 api-version 8.6」的那一版（须先按元数据核实，禁止默写）。
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    // accessWidenerPath = file("src/main/resources/examplemod.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API：本档 src 有 import net.fabricmc.fabric.api.*，不启用这条就编译不过
    // 坐标 groupId 与本文件 Cloth 段的 exclude group 同源；版本取自 gradle.properties 的 fabric_api_version，不在此硬编码
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config（配置系统）
    // modApi("me.shedaniel.cloth:cloth-config-fabric:13.0.0+1.21") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta", "examplemod.mixins.json"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "maven_group": project.maven_group
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

// 中文注释在 Windows 默认码集（GBK）下会让 :javadoc 报「编码 GBK 的不可映射字符」
tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}
