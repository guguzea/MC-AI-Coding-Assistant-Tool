# Mod Properties
mod_version=1.0.0
mod_id=examplemod
mod_name=Example Mod
mod_description=An example Fabric mod
maven_group=com.example

# Fabric Properties
minecraft_version=1.21.3
yarn_mappings=1.21.3+build.2
loader_version=0.16.9
fabric_api_version=0.110.0+1.21.3

# Gradle Properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
# 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
# 发现钉值过期或有误，请提 issue：
# https://github.com/guguzea/MC-AI-Coding-Assistant-Tool/issues
# ================================================================

# ---------------------------------------------------------------------------
# 开发期 loader（可选）：只作用于 Loom 的 `runClient`（见 build.gradle 的 fabric-loader 依赖行），
# **不影响**发布件 `fabric.mod.json` 里 `depends.fabricloader` 的声明下限（那仍由上面的 loader_version 决定）。
# 用途：本档要加 Fabric Language Kotlin 时，把**开发期** loader 提到 FLK 地板即可，不必抬高玩家侧门槛
#   FLK 1.13.4+kotlin.2.2.0 → fabricloader >=0.16.9 ；FLK 1.14.1+kotlin.2.4.20 → >=0.19.5
loader_version_dev=0.19.5
