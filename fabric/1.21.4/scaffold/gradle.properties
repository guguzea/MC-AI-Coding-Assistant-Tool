mod_version=1.0.0
mod_id=examplemod
maven_group=com.example
minecraft_version=1.21.4
org.gradle.jvmargs=-Xmx2G
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
# 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
# 发现钉值过期或有误，请提 issue：
# https://github.com/guguzea/MC-AI-Coding-Assistant-Tool/issues
# ================================================================

# ---- 版本钉值（2026-10-05 补记）----
# 注意：本文件不支持行内注释（# 必须独占行首，否则会被当成值的一部分）；也不要写 "> 说明" 这类行。
# yarn_mappings 出处：query_upstream_releases --source=fabric-yarn --minecraftVersion=1.21.4（2026-10-05 现查 latest）
yarn_mappings=1.21.4+build.8
# loader_version / loom_version 出处：与本仓 fabric/1.21.11/scaffold 同 pin（官方模板 FabricMC/fabric-example-mod @ 8cd77ea）；
# 该组合在本仓 base-mod 矩阵里真机跑过 12 项自检。
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
# fabric_api_version 出处：scripts/fabric-api-version-pins.json（basis: modrinth slug=fabric-api 的 gameVersions；asOf 2026-09-28）
fabric_api_version=0.119.4+1.21.4
# 本档仍是 reference 形态（无 wrapper 三件套）⇒ 不能直接 ./gradlew build；
# 补齐后 build.gradle 可解析：用同族 wrapper（如 fabric/1.21.11/scaffold 的三件套）即可构建。
