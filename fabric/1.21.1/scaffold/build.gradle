plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    // 游玩自测（可选；正常开发不需要）：本档属 `fabric 1.20.4 / 1.21.1 / 1.21.3` 同族，
    // 进程内驱动**不能**靠 IntegratedServerLoader.start 自己进世界 —— 该调用会把 Render thread
    // 冻在 MinecraftClient.startIntegratedServer 的 Thread.sleep（jstack 实测 2026-10-01），
    // 客户端整只停住、心跳停，而桥 /status 仍答 ready=true（极具误导）。
    // 改用 vanilla quick play：取消下面注释，并把存档目录名换成你自己的（存档须已存在）：
    // runs {
    //     client {
    //         programArgs "--quickPlaySingleplayer", "playtest_demo"
    //     }
    // }
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // 开发期 loader：优先用 `loader_version_dev`（若有），否则回落到发布件声明下限 `loader_version`
    // （拆分原因：加 FLK 需抬开发期 loader，但不该抬高 fabric.mod.json 的玩家侧门槛）
    modImplementation "net.fabricmc:fabric-loader:${project.hasProperty('loader_version_dev') ? project.loader_version_dev : project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config（可选，本档保持注释——同族 1.21.3 / 1.20.4 亦然）。启用它会立刻失败，两个独立原因：
    //   ① 本文件 repositories 只有 mavenCentral() 与 https://maven.fabricmc.net/，没有 Cloth 自己的仓库
    //      https://maven.shedaniel.me/；
    //   ② 15.0.96 这个版本上游不存在（2026-09-14 实取 maven.shedaniel.me/.../cloth-config-fabric/maven-metadata.xml，
    //      1.21 线列的是 15.0.127 / 15.0.128 / 15.0.130 / 15.0.140）。
    // 实测：启用态下 `gradlew build` 配置期即报 `Could not find me.shedaniel.cloth:cloth-config-fabric:15.0.96`。
    // 三处一致 ⇒ 注释才是本档形态：src 无任何 me.shedaniel 导入；fabric.mod.json 的 depends 里也没有 cloth 条目。
    // 真要接 Cloth：先补上面的仓库，再换成上游真实存在的版本（版本自行核实，禁止默写）。
    // modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.96"
    // include "me.shedaniel.cloth:cloth-config-fabric:15.0.96"

    // modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+extra"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_api_version", project.fabric_api_version

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "fabric_api_version": project.fabric_api_version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description
    }
}

tasks.named('jar').configure {
    manifest {
        attributes([
                "Fabric-ModuleType": "Lib",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : project.maven_group
        ])
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesName}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}
