plugins {
    id 'fabric-loom' version '0.10.31'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    mixin {
        add( sourceSets.main, "${project.mod_id}.refmap.json" )
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API：本档 src 有 2 处 import net.fabricmc.fabric.api.*，不启用这条就编译不过
    // 坐标 groupId 与本文件 Cloth 段的 exclude group 同源；版本取自 gradle.properties 的 fabric_api_version，不在此硬编码
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config（配置系统）
    // modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta", "examplemod.mixins.json"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_authors": project.mod_authors,
            "mod_license": project.mod_license,
            "maven_group": project.maven_group
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 16
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(16)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

// 中文注释在 Windows 默认码集（GBK）下会让 :javadoc 报「编码 GBK 的不可映射字符」
tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}
