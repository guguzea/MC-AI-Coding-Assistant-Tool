// 本档钉的 fabric-loom '0.4-SNAPSHOT'（实取 0.4.33）在 2026 年已无法从零装配 MC：
// 它的 DownloadUtil 发 Accept-Encoding 却不解 gzip，Mojang 返回的 JSON 被原样按 gzip 落盘，
// 配置期报 Expected BEGIN_OBJECT but was STRING at line 1 column 1 path $（另有 SNAPSHOT 漂移风险）。
// 实测把钉换成 0.6.60 或 0.7.35，其余按本文件现状，可在 JDK 8 + Gradle 6.9.4 下 BUILD SUCCESSFUL。
// 改钉属版本兼容取舍 ⇒ 未代改，本档不登记 scaffold.buildVerified。
plugins {
    id 'fabric-loom' version '0.4-SNAPSHOT'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

// 实测本档 wrapper 钉的 Gradle 6.9.4 配置期报 Could not find method base() ⇒ 改用 6.x 认的顶层属性
archivesBaseName = project.mod_id

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

// 本档 Loom（0.4-SNAPSHOT，实取 0.4.33）不注册 `loom` 扩展：空壳 `loom { }` 也会在配置期报
// Could not find method loom()。1.14.x 若要 mixin，须按当时 loom/mixin 的写法另取证，不要照抄邻版的 loom 块。

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API（本档 ExampleMod 已 import net.fabricmc.fabric.api.*，必须启用）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 注意：1.14.x 的 Fabric API 版本较旧，部分功能可能不可用
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_authors": project.mod_authors,
            "mod_license": project.mod_license,
            "maven_group": project.maven_group
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

// 1.14.x 必须使用 Java 8 编译；1.8 由下面 java 块的 source/targetCompatibility 钉住。
// 别加 options.release：--release 是 JDK 9+ 的 javac 开关，实测 JDK 8 下报 invalid flag: --release
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
