plugins {
    id 'fabric-loom' version '0.4-SNAPSHOT'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

// Gradle 6.9.4（本档 wrapper 钉死）没有 base { archivesName } 访问器（7.1+ 起）⇒ 用 6.x 的顶层属性
archivesBaseName = project.mod_id

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

// 本档 Loom（0.4-SNAPSHOT，实取 0.4.33）不注册 `loom` 扩展：空壳 `loom { }` 也会在配置期报
// Could not find method loom()。1.14.x 若要 mixin，须按当时 loom/mixin 的写法另取证，不要照抄邻版的 loom 块。

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API（本档 ExampleMod 已 import net.fabricmc.fabric.api.*，必须启用）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // 注意：1.14.x 的 Fabric API 版本较旧，部分功能可能不可用
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_authors": project.mod_authors,
            "mod_license": project.mod_license,
            "maven_group": project.maven_group
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

// 1.14.x 必须使用 Java 8 编译
// 如果使用 JDK 11+ 编译，需要设置 release 为 8
tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// withSourcesJar() 是 Gradle 7.1+ 的 java 扩展方法；6.9.4 用显式 task
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}
artifacts { archives sourcesJar }
