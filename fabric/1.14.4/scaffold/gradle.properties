# JVM
org.gradle.jvmargs=-Xmx2G

# Fabric
fabric.loom.platform=fabric

# Version numbers (used by build.gradle)
minecraft_version=1.14.4
yarn_mappings=1.14.4+build.18
loader_version=0.3.7.111
fabric_api_version=0.28.5+1.14
mod_version=1.0.0
mod_id=examplemod
mod_name=Example Mod
mod_description=An example Fabric mod
mod_authors=ExampleAuthor
mod_license=MIT
maven_group=com.example
# ================================================================
# 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
# （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
# runClient 在依赖解析阶段即拒启 Incompatible mods found）。
