// Official template: FabricMC/fabric-example-mod @ 8cd77ea (branch 1.21.11, 2026-08-15)
// Adapted to this tree's package `com.example.examplemod` + Yarn (existing mixin/entity sources).
// Do not copy fabric/1.21.3 scaffold. splitEnvironmentSourceSets omitted so existing main-tree mixins stay valid.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def replaceProperties = [
        version           : project.version,
        minecraft_version : project.minecraft_version,
        yarn_mappings     : project.yarn_mappings,
        loader_version    : project.loader_version,
        fabric_api_version: project.fabric_api_version,
        mod_id            : project.mod_id,
        mod_name          : project.mod_name,
        mod_description   : project.mod_description,
        maven_group       : project.maven_group,
        mod_authors       : project.mod_authors,
        mod_license       : project.mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(["fabric.mod.json", "pack.mcmeta", "examplemod.mixins.json"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
