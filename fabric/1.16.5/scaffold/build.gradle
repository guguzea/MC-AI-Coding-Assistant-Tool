plugins {
    id 'fabric-loom' version '0.10.31'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    mixin {
        add( sourceSets.main, "${project.mod_id}.refmap.json" )
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // mixin 注解处理器需要 log4j，而 loom 0.10.31 不把它放上 annotationProcessor 路径
    // （实测 `gradlew dependencies --configuration annotationProcessor`：该路径只有 sponge-mixin 0.9.2+mixin.0.8.2
    //   等 9 项、无任何 log4j），:compileJava 因此崩在 AnnotatedMethodInfo.<clinit> 的 LogManager。
    // 取 2.17.1 = Log4Shell 之后的修复稳定线（2.0-beta9 是当年 issue 的写法，早于全部安全修复 ⇒ 不用）。
    annotationProcessor "org.apache.logging.log4j:log4j-core:2.17.1"

    // Fabric API（本档 ExampleAnimalEntity / ExampleModClient 已 import net.fabricmc.fabric.api.*，必须启用）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config（配置系统）
    // modApi("me.shedaniel.cloth:cloth-config-fabric:6.0.50+1.16.5") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "yarn_mappings", project.yarn_mappings
    inputs.property "loader_version", project.loader_version

    filesMatching(["fabric.mod.json", "pack.mcmeta", "examplemod.mixins.json"]) {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "yarn_mappings": project.yarn_mappings,
            "loader_version": project.loader_version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_authors": project.mod_authors,
            "mod_license": project.mod_license,
            "maven_group": project.maven_group
    }
}

tasks.named('jar').configure {
    manifest {
        attributes(
            "Fabric-ModuleType": "Lib",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": project.maven_group
        )
    }
}

// 1.16.5 游戏运行在 Java 8（Mojang version manifest: javaVersion.majorVersion = 8）
// 用 JDK 8–16 编译都可以，但必须用 release 8 锁定 Java 8 字节码与 API
tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}

// 中文注释在 Windows 默认码集（GBK）下会让 :javadoc 报「编码 GBK 的不可映射字符」
tasks.withType(Javadoc).configureEach {
    it.options.encoding = 'UTF-8'
}
