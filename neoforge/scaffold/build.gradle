// ⚠️ 本目录是「已废弃的扁平 scaffold」（见同目录 README.md）。本文件不是可用模板，别拷进工程：
//   1) 插件 id 与版本区间互相矛盾——`net.neoforged.gradle` 在插件门户上最新只到 6.0.21
//      （实测 2026-09-11：plugins.gradle.org/m2/.../net.neoforged.gradle.gradle.plugin/maven-metadata.xml），
//      而这里写的 [7.0.15,7.2) 只有 `net.neoforged.gradle.userdev`（NeoGradle，最新 7.1.38）才满足。
//   2) 下面的 minecraft { mappings channel: ... } / minecraft "net.neoforged:..." 是 ForgeGradle 语法，
//      NeoGradle 与 ModDevGradle 都不是这套写法。
//   正确模板：neoforge/<精确版本>/scaffold/build.gradle（id 'net.neoforged.moddev' + neoForge { version = ... }），
//   或从零工程走 download_official_mdk。
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle' version '[7.0.15,7.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // ForgeGradle 写法（mapping_channel / mapping_version 两个键也只存在于本废弃目录的 gradle.properties）
    // MDG 用 parchment { mappingsVersion = ...; minecraftVersion = ... }，见 neoforge/<ver>/scaffold
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'neoforge.logging.markers', 'REGISTRIES'
            property 'neoforge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'neoforge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/'),
                '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.neoforged:neoforge:${neoform_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version       : neoforge_version,
        neoforge_version_range : neoforge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_license           : mod_license,
        mod_version           : mod_version,
        mod_authors           : mod_authors,
        mod_description       : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Specification-Title'     : mod_id,
            'Specification-Vendor'     : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
