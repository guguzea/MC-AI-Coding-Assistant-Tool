// NeoForge 26.1 scaffold — ModDevGradle 参考骨架（C-5）。
// ⚠️ 版本锚点仅为参考（Gradle ≥9.1 / MDG 2.0.144（2026-08-23 maven latest）/ neo_version 26.1.2.109）；
// 从零工程请以 download_official_mdk 实际产物的 gradle.properties 为准，禁止凭记忆改数字。
// neo_version 取值：2026-09-16 实读 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
// （lastUpdated 20260915214625；26.x 共 238 个版本，26.1 线最新 26.1.2.109；同文件 26.2 线最新 26.2.0.88、
// 26.3 线已出现 26.3.0.0-beta / 26.3.0.1-beta）。注意该文件的 <release> 标签此刻指向 26.3.0.1-beta
// （**不是** 26.1 线），**不要**拿它当 26.1 最新版，必须按 26.1 前缀自行取最大。
// 本档去混淆：无 mappings / parchment 配置；依赖用 implementation 而非 modImplementation。

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = '26.1.2.109'

    runs {
        client { client() }
        server { server() }
    }

    mods {
        examplemod {
            sourceSet sourceSets.main
        }
    }
}
// ================================================================
// 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
// （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
// runClient 在依赖解析阶段即拒启 Incompatible mods found）。
// 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
// 发现钉值过期或有误，请提 issue：
// https://github.com/guguzea/MC-AI-Coding-Assistant-Tool/issues
// ================================================================
