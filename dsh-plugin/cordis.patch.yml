# dsh-mc-skill 的 bundle 补丁：往 profile 里插一行插件。
#
# name 用 `./lib/index.js`（相对**本文件**的路径），不是裸包名：
#   dsh-app-boot 的 anchorInsertedPluginNames 会把 insert 行里以 ./ 开头（或绝对路径）的 name
#   转成相对本 patch 文件的 file URL。这样它从 profile 的 node_modules 里解析，
#   而不是从 DSH 安装目录（asar 内）解析 —— 裸包名会走 loader 自身的 import 上下文，找不到。
#
# repoRoot 必须改成你机器上 MC_skill 仓库的**绝对路径**（正斜杠）。
- insert:
    - id: mc-skill
      name: ./lib/index.js
      config:
        repoRoot: "C:/Users/zzrCN/OneDrive/桌面/MC_skill"
