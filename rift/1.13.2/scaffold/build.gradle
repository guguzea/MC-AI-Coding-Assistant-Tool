apply plugin: 'net.minecraftforge.gradle.tweaker-client'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = '1.13.2'
    mappings = 'snapshot_20180921'
    runDir = 'run'
    tweakClass = 'org.dimdev.riftloader.launch.RiftLoaderClientTweaker'
}

repositories {
    // dimdev.org maven 可能已失效；把 rift 的 dev jar 放进 libs/
    flatDir { dirs 'libs' }
}

dependencies {
    implementation name: 'rift-1.0.3-45-dev'
}
// ================================================================
// 兼容声明：本文件钉值随 modloader / 工具链版本演进，可能已过期或与最新构建不兼容
// （实测例：Fabric Language Kotlin 1.14.1 要求 fabricloader >=0.19.5，而某档钉 0.19.3 时
// runClient 在依赖解析阶段即拒启 Incompatible mods found）。
// 钉值仅供参考，一律以实际解析结果与该 loader / 库的官方发布为准。
