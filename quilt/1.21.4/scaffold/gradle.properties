org.gradle.jvmargs=-Xmx2G
minecraft_version=1.21.4
# loom / loader 版本对照官方 Quilt 模板，禁止臆造
# yarn build 号（build.gradle mappings 行的 +build.1）以 https://fabricmc.net/develop/yarn/ 当前为准，禁止照抄
yarn_mappings=1.21.4+build.8
# ================================================================
