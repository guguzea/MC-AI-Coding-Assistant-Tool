plugins {
    // loom 版本取 maven.quiltmc.org/repository/release/org/quiltmc/loom/maven-metadata.xml
    //   最新 release = 1.15.1（lastUpdated 20260123082830，核对日期 2026-09-02）
    // ⚠️ 构建 JVM（跑 Gradle 的那个）必须是 **JDK 21+**：loom 1.15.1 的插件元数据声明 "requires at least JVM runtime
    //   version 21"（实测 2026-10-01）。本档 toolchain 也是 21 ⇒ 直接 JAVA_HOME=<jdk21> 即可，无需额外 toolchain 指路。
    id 'org.quiltmc.loom' version '1.15.1'
    id 'maven-publish'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
version = '1.0.0'
group = 'com.example'
base { archivesName = 'examplemod' }
repositories { maven { url = 'https://maven.quiltmc.org/repository/release' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // quilt-loader 取 maven.quiltmc.org/repository/release/org/quiltmc/quilt-loader/maven-metadata.xml
    //   最新 = 0.31.0-beta.4（lastUpdated 20260904212919，核对日期 2026-09-19）
    modImplementation "org.quiltmc:quilt-loader:0.31.0-beta.4"
    // 入口点（quilt.mod.json 的 entrypoints.main）用 quilt-loader 自带的 net.fabricmc.api.ModInitializer
    //   （@Deprecated 兼容接口，本进程内自带，无需额外依赖）。
    // ⚠️ quilt-loader 0.31 起 Quilt 原生 org.quiltmc.loader.api.entrypoint.ModInitializer 已删除（javap 实测 2026-10-01）；
    //   官方替代是 QSL 的 org.quiltmc.qsl.base.api.entrypoint.ModInitializer#onInitialize(ModContainer)，构件
    //   org.quiltmc.qsl.core:qsl_base（javap 实测签名）；QSL 构件只出到 MC 1.21.1，故本档默认不引 QSL 依赖。
    //   注册仍用 Vanilla Registry.register；不要把 fabric-api 整包当 QSL。
    // API 库：本档默认不引任何 API 库（QSL 无本版件）。需要 Fabric API 能力（渲染 / 物品栏 / 按键 / 网络等）时直接加 Fabric API 本体：
    //   modImplementation "net.fabricmc.fabric-api:fabric-api:<FAPI 版本>+1.21.8"    // 本版线最新 live 读数 = 0.136.1+1.21.8
    //   版本取 https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml；Fabric maven = maven.fabricmc.net
    //   （若解析不到该仓库，补 repositories { maven { url = 'https://maven.fabricmc.net/' } }）。
    //   Quilt Loader 加载 Fabric 模组；实证：Jade / owo-lib 的 quilt 构建均声明 fabric-api required（QFAPI 在 1.21.3+ 无构件）。
}
